name: sync orcid publications

on:
  schedule:
    - cron: "0 0 * * 0" # weekly on sundays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-orcid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch orcid works
        env:
          ORCID_ID: "0000-0000-0000-0000" # <-- keep your ORCID iD here
        run: python .github/scripts/fetch_orcid.py

      - name: commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: update publications from orcid"
            git pull --rebase origin main
            git push origin main
          fi
