name: sync orcid publications

on:
  schedule:
    - cron: "0 0 * * 0" # weekly on sundays
  workflow_dispatch: # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch orcid works
        env:
          ORCID_ID: "0009-0006-0366-4242" # <-- paste your ORCID iD here
        run: python .github/scripts/fetch_orcid.py

      - name: commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update publications from orcid"
          git push
