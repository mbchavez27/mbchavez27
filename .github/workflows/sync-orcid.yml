name: sync orcid publications

on:
  schedule:
    - cron: "0 0 * * 0" # weekly on sundays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-orcid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: sync readme with orcid
        env:
          ORCID_ID: "0009-0006-0366-4242" # <-- keep your ORCID iD here
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python .github/scripts/fetch_orcid.py
            if git diff --quiet -- README.md; then
              echo "no publication changes"
              exit 0
            fi
            git add README.md
            git commit -m "chore: update publications from orcid"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), retrying"
            sleep $((attempt * 5))
          done
          exit 1
